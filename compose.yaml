services:
  redmine:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-secrets}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run ./scripts/setup-secrets}
      PORTFOLIO_ADMIN_PASSWORD: ${PORTFOLIO_ADMIN_PASSWORD:?Run ./scripts/setup-secrets}
    ports:
      - "127.0.0.1:${REDMINE_PORT:-3000}:3000"
    volumes:
      - uploads:/usr/src/redmine/files
    networks:
      - frontend
      - database
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-secrets}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "redmine", "-d", "redmine"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - database
networks:
  frontend:
  database:
    internal: true
volumes:
  postgres:
  uploads:
